[package]
name = "airs-config"
version = "0.1.0"
edition = "2024"
description = "Layered runtime configuration for AIRS"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
serde = "1"
serde_json = "1"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
